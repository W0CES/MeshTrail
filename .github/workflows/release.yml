name: Publish Release Wheel
run-name: Publish MeshTrail ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: meshtrail-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify release version
        run: python scripts/check_release_version.py --tag "$RELEASE_TAG"
      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Run container smoke test
        run: docker build --file tests/Dockerfile.smoke --tag meshtrail-release-smoke .
      - name: Build wheel and bundle
        run: |
          python -m build --wheel
          python -c 'import os, zipfile; from pathlib import Path; tag=os.environ["RELEASE_TAG"]; wheel=next(Path("dist").glob("*.whl")); archive=Path("dist") / f"meshtrail-{tag}-wheel.zip"; z=zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED); z.write(wheel, wheel.name); z.close()'
      - name: Upload tested release assets
        uses: actions/upload-artifact@v4
        with:
          name: meshtrail-release-assets
          path: |
            dist/*.whl
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Download tested release assets
        uses: actions/download-artifact@v4
        with:
          name: meshtrail-release-assets
          path: release-assets
      - name: Publish or refresh the GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "MeshTrail $RELEASE_TAG"
          fi

